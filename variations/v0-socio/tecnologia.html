  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script

cc-dark:#E2582A; /* acento sobre la sección oscura (fondo = --ink) */\n  --bg2:color-mix(in srgb,var(--bg) 95%,var(--ink));\n  --card:color-mix(in srgb,var(--bg) 88%,var(--ink));\n  --soft:color-mix(in srgb,var(--ink) 75%,var(--bg));\n  --ink2:color-mix(in srgb,var(--ink) 85%,var(--bg));\n  --line:color-mix(in srgb,var(--ink) 16%,transparent);\n  --on-ink:var(--bg);\n  --on-ink-soft:color-mix(in srgb,var(--bg) 82%,var(--ink));\n  --on-ink-acc:var(--acc-dark);\n  --line-on:color-mix(in srgb,var(--bg) 18%,transparent);\n  --line-strong:color-mix(in srgb,var(--ink) 25%,transparent); /* eje vertical único: hero, splits, manifiesto y proceso */\n  --hov:var(--ink2);                 /* hover de enlaces y botón primario */\n  --btn:var(--ink);                  /* fondo del botón primario sobre claro */\n  --ph-a:var(--ink);--ph-b:var(--ink2); /* degradado de la banda de frase */\n  --ph-tint:var(--acc-dark);--ph-op:.3; /* duotono de las imágenes sobre oscuro */\n  --hl:var(--acc-dark);              /* resaltados e ilustración sobre oscuro */\n  --ok:var(--ink);                   /* mensaje de éxito del formulario (sobre claro) */\n  --sp:clamp(24px,4vw,56px);\n  --display:\"Outfit\",sans-serif;--logo:\"Lexend Giga\",\"Outfit\",sans-serif;--sans:\"Instrument Sans\",sans-serif;--mono:\"JetBrains Mono\",ui-monospace,monospace;\n  --wrap:1120px;--pad:clamp(20px,4vw,40px);--sec:96px;\n  --ease:cubic-bezier(.22,.61,.36,1);\n}\n\n/* ---- Paletas ---- */\n/* Rust (cliente): tokens exactos. Core #B83A0E solo como texto sobre White; sobre Paper el texto acentuado va en Rust deep. Sobre oscuro, siempre bright.\n   Escala: Ember #4A1906 · Deep #8C2C0A · Core #B83A0E · Bright #E2582A · Light #F87A4E · Blush #F6D3C3\n   Neutros: Ink #17120F · Surface #241C17 · Line #3A2F28 · Stone #9A8F85 · Stone dark #6B625A · Paper #E9E1D4 · White #F4EFE7\n   Soporte (solo estados): Pine #2E4A38 / #8FB59C · Ochre #7A5410 / #D9A13B */\n.lnl[data-pal^=\"rust\"]{\n  --bg:#F4EFE7;--ink:#17120F;--acc:#B83A0E;--acc-dark:#E2582A;\n  --bg2:#E9E1D4;--card:#E9E1D4;\n  --soft:#6B625A;--on-ink-soft:#9A8F85;--line-on:#3A2F28;--surface:#241C17;\n  --hov:#8C2C0A;--btn:#B83A0E;\n  --ph-a:#4A1906;--ph-b:#17120F;\n  --ph-tint:#4A1906;--ph-op:1;\n  --hl:#F87A4E;\n  --ok:#2E4A38;--ok-on:#8FB59C;--warn:#7A5410;--warn-on:#D9A13B;\n}\n.lnl[data-pal^=\"rust\"] ::selection{background:#F6D3C3;color:#17120F}\n.lnl[data-pal^=\"rust\"] .chip.on{background:#F6D3C3;color:#17120F}\n/* Variantes de Rust (solo cambian fondos claros y el acento; neutros y apoyo son los mismos) */\n/* Rust Paper: fondo de página en Paper, secciones en White; el acento sobre Paper pasa a Rust deep (6.5:1) */\n.lnl[data-pal=\"rust-paper\"]{--bg:#E9E1D4;--bg2:#F4EFE7;--card:#F4EFE7;--acc:#8C2C0A}\n/* Rust Ember: los bloques oscuros usan Ember en vez de Ink; sobre Ember el acento es Rust light (5.5:1) */\n.lnl[data-pal=\"rust-ember\"]{--ink:#4A1906;--acc-dark:#F87A4E;--line-on:color-mix(in srgb,var(--bg) 18%,transparent);--ph-tint:#8C2C0A;--ph-op:.5}\n\n/* ============ 2. BASE ============ */\nbody{margin:0}\n.lnl{font:400 17px/1.6 var(--sans);color:var(--ink);background:var(--bg);position:relative}\n.lnl *{box-sizing:border-box;border-radius:0}\n.lnl a{color:var(--ink)}\n.lnl a:hover{color:var(--hov)}\n.lnl h1,.lnl h2,.lnl h3{font-family:var(--display);font-weight:600;letter-spacing:-.02em;line-height:1.05;text-wrap:balance;margin:0}\n/* Contraste de peso: lo fino observa, lo grueso entrega (Outfit 300 solo desde 40px) */\n.lnl h1,.lnl h2{font-weight:300}\n.lnl h1 b,.lnl h2 b{font-weight:600}\n.lnl h1{font-size:clamp(2.5rem,5vw,3.6rem)}\n.lnl h2{font-size:clamp(2.5rem,4.4vw,3.25rem)}\n.lnl h3{font-weight:600;font-size:1.4rem;line-height:1.15}\n.lnl p{margin:0;text-wrap:pretty}\n.lnl [id]{scroll-margin-top:84px}\n.lnl :focus-visible{outline:2px solid var(--ink);outline-offset:3px}\n.dark :focus-visible{outline-color:var(--acc-dark)}\n.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--pad)}\n.wrap.narrow{max-width:1000px}\n.sec{padding:var(--sec) 0}\n.soft{color:var(--soft)}\n.lead{max-width:52ch;color:var(--soft);margin-top:18px!important}\n.long{max-width:58ch;color:var(--soft);margin-top:18px!important}\n.dark{background:var(--ink);color:var(--bg);--line-strong:var(--line-on)}\n.lnl .dark a{color:var(--on-ink)}\n.dark .lead,.dark .long,.dark .soft{color:var(--on-ink-soft)}\n.bg2{background:var(--bg2)}\n\n/* Botón principal + enlace de texto con flecha */\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 20px;font:500 14px/1.2 var(--mono);\n  background:var(--btn);color:var(--bg)!important;border:1px solid var(--btn);text-decoration:none;cursor:pointer;transition:background-color .2s}\n.btn:hover{background:var(--hov);border-color:var(--hov)}\n.dark .btn{background:var(--acc-dark);border-color:var(--acc-dark);color:var(--ink)!important}\n.tl{min-height:44px;padding:10px 0;font:500 14px/1.2 var(--mono);background:none;border:0;color:var(--ink);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:5px}\n.tl:hover{text-decoration-color:var(--ink)}\n\n/* Firma bajo los títulos: regla técnica de 160px (cuadrado de 8px en --acc, línea de 1px y marca final), como la escala de la gráfica */\n.div3{display:flex;align-items:center;width:160px;max-width:100%;padding:0}\n.div3 i{display:block;flex:none}\n.div3 i:nth-child(1){width:8px;height:8px;background:var(--acc)}\n.div3 i:nth-child(2){flex:1;height:1px;background:var(--line-strong)}\n.div3 i:nth-child(3){width:1px;height:8px;background:var(--line-strong)}\n\n/* Firma de las columnas izquierdas: debajo del título, 24px de separación */\n.sp-l .div3,.proc-title .div3,.why-txt .div3{margin-top:24px}\n\n/* ============ 3. HEADER + MEGA MENÚ ============ */\n.hdr{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) calc(var(--hs) * 100%),transparent);border-bottom:1px solid color-mix(in srgb,var(--ink) calc(var(--hs) * 16%),transparent)}\n.hdr-in{display:flex;align-items:center;gap:28px;min-height:72px}\n/* Logo (cliente): \"Log N\" en Lexend Giga 300, \"Labs\" en 600, N completa en --acc (--acc-dark sobre oscuro).\n   Cortes horizontales: una línea de corte en \"og\" y tres en la N (máscaras). Tres versiones: sobre White (header), sobre Ink (pie) y sobre bloque Rust (pie, todo en White). */\n.logo{--logo-acc:var(--acc);display:inline-flex;align-items:center;gap:12px;font:300 22px/1 var(--logo);letter-spacing:0;color:var(--ink)!important;text-decoration:none;white-space:nowrap}\n.logo b{font-weight:600}\n.dark .logo{--logo-acc:var(--acc-dark)}\n.logo .sl,.logo .nn{display:inline-block}\n.logo .sl{-webkit-mask:linear-gradient(to bottom,#000 0 50%,transparent 50% 55%,#000 55%);mask:linear-gradient(to bottom,#000 0 50%,transparent 50% 55%,#000 55%)}\n.logo .nn{color:var(--logo-acc);-webkit-mask:linear-gradient(to bottom,#000 0 30%,transparent 30% 35%,#000 35% 46%,transparent 46% 51%,#000 51% 62%,transparent 62% 67%,#000 67%);mask:linear-gradient(to bottom,#000 0 30%,transparent 30% 35%,#000 35% 46%,transparent 46% 51%,#000 51% 62%,transparent 62% 67%,#000 67%)}\n.nav{display:flex;align-items:center;gap:4px;margin-left:auto}\n.nav a,.nav button{font:500 17px/1 var(--sans);color:var(--ink);background:none;border:0;padding:14px 12px;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px}\n.nav a:hover,.nav button:hover{color:var(--hov)}\n.nav .ic{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}\n.burger{display:none;margin-left:auto;width:48px;height:48px;background:none;border:1px solid var(--line);color:var(--ink);cursor:pointer;align-items:center;justify-content:center}\n.burger .ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round}\n.progress{position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--ink);transform-origin:left;transform:scaleX(var(--scroll,0))}\n.mega{position:absolute;left:0;right:0;top:100%;background:var(--card);border-bottom:1px solid var(--line);border-top:1px solid var(--line)}\n.mega-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-left:1px solid var(--line)}\n.mega a{display:flex;gap:16px;align-items:flex-start;padding:20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}\n.mega a:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}\n.mega b{display:block;font:600 1.1rem/1.25 var(--display)}\n.mega span.d{display:block;font-size:15px;line-height:1.4;color:var(--soft);margin-top:4px}\n\n\n/* ============ FONDOS CON IMAGEN (duotono con la paleta activa) ============\n   Las fotos están en escala de grises: --acc-dark × foto = tono de la paleta; se mezcla en \"screen\" sobre --ink con baja opacidad.\n   Así nunca aparece el color original y el texto mantiene el contraste. */\n.ph{position:relative;isolation:isolate;overflow:hidden}\n.ph::before{content:\"\";position:absolute;inset:0;z-index:-1;pointer-events:none;background-color:var(--ph-tint);background-size:cover;background-position:center;background-blend-mode:multiply;mix-blend-mode:screen;opacity:var(--ph-op)}\n.ph-dash::before{background-image:var(--dash);background-color:var(--acc-dark);opacity:.3;-webkit-mask-image:linear-gradient(90deg,#000 0%,#000 35%,rgba(0,0,0,.3) 100%),linear-gradient(180deg,transparent 0,#000 28%);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,#000 0%,#000 35%,rgba(0,0,0,.3) 100%),linear-gradient(180deg,transparent 0,#000 28%);mask-composite:intersect}\n.ph-flow::before{background-image:url(data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAA8LDA0MCg8NDA0REA8SFyYZFxUVFy8iJBwmODE7OjcxNjU9RVhLPUFUQjU2TWlOVFteY2RjPEpsdGxgc1hhY1//wAALCAL8BXgBAREA/8QAGwAAAQUBAQAAAAAAAAAAAAAAAAECAwQFBgf/xABDEAACAgIBAwMCBAUCBQMCAwkBAgADBBEhBRIxE0FRImEGFDJxI0JSgZGhwRUkM7HRQ2LhcvAWJVOC8TQ1kqJzssL/2gAIAQE lumns:1fr 1fr;min-height:487px}\n.hero-l{display:flex;align-items:flex-end;padding:56px clamp(24px,4vw,56px) 56px 0}\n.lnl .hero h1{font-size:clamp(2.4rem,4.6vw,4rem)}\n.hero-txt p{max-width:46ch;margin-top:28px;color:var(--soft)}\n.hero-r{border-left:1px solid var(--line-strong);display:grid;grid-template-rows:auto auto;align-content:center}\n.m{padding:clamp(20px,2.4vw,32px) 0 clamp(20px,2.4vw,32px) clamp(24px,4vw,56px)}\n/* Rótulos de los módulos */\n.mlab{display:block;font:500 13px/1.4 var(--mono);color:var(--soft)}\n.m-serv{border-bottom:1px solid var(--line)}\n.slides{display:grid}\n.slide{grid-area:1/1;opacity:0;pointer-events:none}\n.slide.on{opacity:1;pointer-events:auto}\n/* Nombre del servicio: lo fino observa (200), lo grueso entrega (800) */\n.sv-t{font:300 2.4rem/1.1 var(--display);letter-spacing:-.02em;text-wrap:balance}\n.sv-t b{font-weight:600}\n.slide p{margin-top:10px;color:var(--soft);max-width:34ch}\n.ind{display:flex;align-items:center;gap:16px;margin-top:24px}\n.segs{display:flex;gap:6px;flex:1}\n.seg{flex:1;height:24px;background:none;border:0;padding:0;cursor:pointer;position:relative}\n.seg::after{content:\"\";position:absolute;left:0;right:0;top:11px;height:2px;background:var(--line)}\n.seg.on::after{background:var(--acc)}\n.how{list-style:none;margin:12px 0 0;padding:0}\n.lnl .how a{display:flex;gap:14px;align-items:baseline;padding:8px 0;text-decoration:none;font:300 1.25rem/1.3 var(--display)}\n.lnl .how a::before{content:\"\";flex:none;width:8px;height:8px;align-self:center;background:var(--acc)}\n.lnl .how a:hover{text-decoration:underline;text-underline-offset:4px}\n.how b{font-weight:600}\n\n/* ============ 4b. ESENCIA ============ */\n.lnl .es h2{font-size:clamp(2.5rem,5vw,3.6rem);max-width:22ch}\n.es-sec{position:relative;overflow:hidden}\n/* La red de Esencia nace del fondo del hero: desvanecida arriba y abajo (el hero la desvanece solo abajo) */\n.es-sec .hero-ph{-webkit-mask-image:linear-gradient(90deg,transparent 25%,#000 100%),linear-gradient(180deg,transparent 0,#000 30%,#000 75%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent 25%,#000 100%),linear-gradient(180deg,transparent 0,#000 30%,#000 75%,transparent 100%);mask-composite:intersect}\n.es-sec>.wrap{position:relative;z-index:1}\n.es-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px;margin-top:64px}\n.es-col{border-top:4px solid var(--ink);padding-top:24px}\n.es-col .ok{display:block;font:500 18px/1 var(--mono);color:var(--acc)}\n.lnl .es-col h3{font:600 1.75rem/1.1 var(--display);letter-spacing:-.02em;margin-top:14px}\n.es-col p{font:300 1.25rem/1.4 var(--display);margin-top:10px;max-width:28ch}\n\n/* ============ 5. SPLIT 50/50 (mismo lenguaje que el hero): título sticky a la izquierda, contenido a la derecha ============ */\n.split{display:grid;grid-template-columns:1fr 1fr;align-items:start}\n.sp-l{position:sticky;top:112px;padding-right:clamp(24px,4vw,56px)}\n.sp-r{border-left:1px solid var(--line-strong);padding-left:var(--sp)}\n.sp-r>.long:first-child{margin-top:0!important}\n/* ---- ¿Por qué? Declaración grande a la izquierda; gráfica vectorial a la derecha ---- */\n/* La gráfica es un fondo de la sección (como las demás imágenes): a la derecha, detrás del texto, desvanecida hacia la izquierda */\n.why{position:relative;overflow:hidden;padding:0;isolation:isolate;--curve:var(--acc-dark)}\n/* Fondo de toda la sección: el mismo del gráfico (resplandor naranja arriba a la derecha + retícula de puntos sobre Ink); el panel ya no es una caja aparte */\n.why::before{content:\"\";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(color-mix(in srgb,var(--bg) 16%,transparent) 1px,transparent 1.2px) 0 0/24px 24px,radial-gradient(120% 90% at 85% 0%,color-mix(in srgb,var(--acc-dark) 16%,var(--ink)) 0%,var(--ink) 62%);-webkit-mask-image:linear-gradient(180deg,#000,#000)}\n/* Dos columnas a la misma altura; el eje central es el borde de la columna derecha y recorre toda la sección */\n/* Empalme Por qué → Servicios: el eje central continúa entre ambas secciones; un nodo y un tramo de luz siguen el scroll (--pr: 0 lejos, 1 en el centro de la pantalla) */\n.seam{position:relative;height:0;z-index:3;pointer-events:none}\n.seam .wrap{position:relative;height:0}\n.seam i{position:absolute;left:50%;display:block}\n.seam .sm-l{top:-120px;height:240px;width:1px;margin-left:-.5px;background:linear-gradient(180deg,transparent,var(--acc-dark),transparent);opacity:calc(.3 + .7 * var(--pr,0))}\n.seam .sm-n{top:-5px;width:10px;height:10px;margin-left:-5px;background:var(--acc-dark);transform:scale(calc(.85 + .5 * var(--pr,0)));outline:1px solid color-mix(in srgb,var(--acc-dark) 55%,transparent);outline-offset:calc(2px + 7px * var(--pr,0))}\n/* Variante sobre fondo claro (hero → Esencia): usa el acento claro */\n.seam.lt .sm-l{background:linear-gradient(180deg,transparent,var(--acc),transparent)}\n.seam.lt .sm-n{background:var(--acc);outline-color:color-mix(in srgb,var(--acc) 55%,transparent)}\n.why-grid{display:grid;grid-template-columns:1fr 1fr;align-items:stretch}\n.why-txt{padding:var(--sec) var(--sp) var(--sec) 0}\n.lnl .why-h{font-size:clamp(2.5rem,4.8vw,3.6rem);margin:0;color:var(--bg)}\n.lnl .why-h b{font-weight:calc(300 + 300 * var(--wp,1))}\n.why-body{max-width:480px;margin-top:48px}\n.lnl .why-p1{font:300 1.6rem/1.35 var(--display);letter-spacing:-.01em;color:var(--bg)}\n.lnl .why-p1 b{font-weight:600}\n.lnl .why-p2{margin-top:24px;max-width:48ch;font:400 17px/1.6 var(--sans);color:var(--on-ink-soft)}\n.why-col{display:flex;flex-direction:column;border-left:1px solid var(--line-strong);padding:var(--sec) 0 var(--sec) var(--sp)}\n/* Panel del gráfico: único elemento oscuro de la sección */\n.why-panel{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px;color:var(--bg);padding:8px 0 0}\n.gr{display:block;width:100%;flex:1;min-height:0}\n.gr line{vector-effect:non-scaling-stroke;stroke-width:1}\n.g-grid line{stroke:color-mix(in srgb,var(--bg) 8%,transparent)}\n.g-axis line{stroke:color-mix(in srgb,var(--bg) 70%,transparent)}\n.gr .tx{font:500 13px var(--mono);fill:var(--bg)}\n.gr .g-ax .tx{fill:color-mix(in srgb,var(--bg) 70%,transparent)}\n.gr .ln{stroke:color-mix(in srgb,var(--bg) 85%,transparent);stroke-width:1.5;stroke-dasharray:6 4}\n.gr .lg{stroke:var(--curve);stroke-width:3;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--curve) 55%,transparent))}\n.gr .ar{fill:url(#ar-g);stroke:none}\n.gr .lb2{fill:var(--curve)}\n.gr .cur{display:none}\n.gr .cur line{stroke:var(--curve)}\n.gr .d1{fill:var(--bg)}.gr .d2{fill:var(--curve)}\n/* Lectura: tres columnas; etiquetas al 60%, cifras al 100% (las de O(log n) con el color de la curva) */\n.rd{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;font:500 13px/1.5 var(--mono);border-top:1px solid color-mix(in srgb,var(--bg) 10%,transparent);padding-top:16px}\n.rl{display:block;color:color-mix(in srgb,var(--bg) 60%,transparent)}\n.rv2{display:grid;color:var(--bg)}\n.rv2>span{grid-area:1/1;opacity:0}\n.rv2>.s5{opacity:1}\n.rc:nth-child(3) .rv2{color:var(--curve)}\n/* ============ 6. SERVICIOS (tabla sobre fondo oscuro) ============ */\n.svc-sec{padding-bottom:calc(var(--sec) + 48px)}\n.sv-art{display:block;width:100%;max-width:420px;margin-top:48px}\n.sv-art path{fill:none}\n.sv-ax{stroke:var(--on-ink);stroke-width:1;opacity:.55}\n.sv-cv{stroke:var(--hl);stroke-width:3;stroke-linecap:round}\n.sv-mk rect{fill:var(--on-ink)}\n/* Acordeón de servicios: abierta = tinta clara; el resto se atenúa */\n.acc{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-on)}\n.acc-r{border-bottom:1px solid var(--line-on)}\n.lnl .acc-b{display:flex;width:100%;justify-content:space-between;align-items:flex-start;gap:20px;background:none;border:0;padding:22px 0;cursor:pointer;text-align:left;color:color-mix(in srgb,var(--bg) 48%,var(--ink));font:300 clamp(2.5rem,3.2vw,2.8rem)/1.1 var(--display);letter-spacing:-.02em}\n.acc-b b{font-weight:600}\n.acc-b:hover,.acc-b[aria-expanded=\"true\"]{color:var(--on-ink)}\n.acc-ic{flex:none;width:22px;height:22px;margin-top:.45em;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}\n.acc-b[aria-expanded=\"true\"] .acc-ic{transform:rotate(180deg)}\n.acc-p{display:grid;grid-template-rows:0fr}\n.acc-p.on{grid-template-rows:1fr}\n.acc-p>div{overflow:hidden;min-height:0}\n.acc-p em{display:block;font:300 1.25rem/1.4 var(--display);font-style:normal;color:var(--on-ink)}\n.acc-p p{margin-top:12px;max-width:52ch;color:var(--on-ink-soft);padding-bottom:26px}\n\n/* ============ 7. BANDA DE UNA FRASE (degradado permitido; palabra de fondo fija) ============ */\n.phrase{position:relative;overflow:hidden;background:linear-gradient(100deg,var(--ph-a),var(--ph-b));color:var(--bg);padding:64px 0}\n/* Marca de agua animada: escribe O(n²) → O(n) → O(n log n) → O(log n) como en el video (la n final en acento) y se repite. Con prefers-reduced-motion queda estática en O(log n). */\n.phrase .wm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font:500 clamp(5rem,18vw,13rem)/1 var(--mono);letter-spacing:-.06em;\n  color:color-mix(in srgb,var(--bg) 6%,transparent);white-space:nowrap;pointer-events:none;transition:opacity .5s}\n.phrase .wm i{font-style:normal;color:color-mix(in srgb,var(--acc-dark) 14%,transparent)}\n.phrase .wm .cu{display:inline-block;width:.04em;height:.8em;margin-left:.04em;vertical-align:-.06em;background:color-mix(in srgb,var(--acc-dark) 40%,transparent)}\n.phrase .wm.off{opacity:0}\n@media (prefers-reduced-motion:no-preference){.phrase .wm .cu{animation:wmcu 1s steps(1) infinite}@keyframes wmcu{50%{opacity:0}}}\n.phrase p{position:relative;z-index:1;text-align:center;font:300 clamp(1.4rem,2.8vw,2rem)/1.2 var(--display);letter-spacing:-.02em;max-width:30ch;margin:0 auto;text-wrap:balance}\n.phrase p b{fon 002Fb>.<\u002Fh1>\n          <p>Digitalizamos los pedidos, el stock y la facturación de tu negocio con sitios, sistemas e integraciones. Trabajamos con WhatsApp Business, pagos con QR y los proveedores de factura electrónica habilitados por la DNIT.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"hero-r\">\n        <div class=\"m m-serv\" data-section=\"hero-servicios\">\n                    <div class=\"slides\">\n            <sc-for list=\"{{svcSlides}}\" as=\"s\" hint-placeholder-count=\"6\">\n              <div class=\"slide {{s.cls}}\" aria-hidden=\"{{s.off}}\"><div class=\"sv-t\">{{s.a}} <b>{{s.b}}<\u002Fb><\u002Fdiv><p>{{s.d}}<\u002Fp><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div class=\"ind\">\n            <div class=\"segs\" role=\"group\" aria-label=\"Servicios\">\n              <sc-for list=\"{{svcSegs}}\" as=\"g\" hint-placeholder-count=\"6\">\n                <button type=\"button\" class=\"seg {{g.cls}}\" aria-label=\"{{g.label}}\" aria-pressed=\"{{g.on}}\" sc-camel-on-click=\"{{g.pick}}\"><\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <a class=\"tl\" href=\"Servicios.dc.html\">Ver todos →<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"m m-how\" data-section=\"hero-proceso\">\n          <span class=\"mlab\">Cómo trabajamos<\u002Fspan>\n          <ul class=\"how\">\n            <li><a href=\"Proceso.dc.html\">Diagnóstico<\u002Fa><\u002Fli>\n            <li><a href=\"Proceso.dc.html\">Diseño<\u002Fa><\u002Fli>\n            <li><a href=\"Proceso.dc.html\">Desarrollo y pruebas<\u002Fa><\u002Fli>\n            <li><a href=\"Proceso.dc.html\"><b>Publicación y soporte<\u002Fb><\u002Fa><\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div class=\"seam lt\" aria-hidden=\"true\"><div class=\"wrap\"><i class=\"sm-l\"><\u002Fi><i class=\"sm-n\"><\u002Fi><\u002Fdiv><\u002Fdiv>\n\n  <section class=\"sec es-sec\" id=\"esencia\" data-section=\"esencia\">\n    <div class=\"hero-ph\" aria-hidden=\"true\"><\u002Fdiv>\n    <div class=\"wrap\">\n      <div class=\"es\">\n        <h2 class=\"rv\">Lo que se te escapa <b>sin un sistema<\u002Fb>.<\u002Fh2>\n        <div class=\"es-grid\">\n          <div class=\"es-col rv\"><span class=\"ok\">[ ok ]<\u002Fspan><h3>Datos repetidos<\u002Fh3><p>Los pedidos se copian del chat a una planilla y de la planilla al sistema de facturación.<\u002Fp><\u002Fdiv>\n          <div class=\"es-col rv d1\"><span class=\"ok\">[ ok ]<\u002Fspan><h3>Stock a ciegas<\u002Fh3><p>Nadie sabe cuánto stock queda sin contar a mano.<\u002Fp><\u002Fdiv>\n          <div class=\"es-col rv d2\"><span class=\"ok\">[ ok ]<\u002Fspan><h3>Factura sin conectar<\u002Fh3><p>Te designaron para emitir factura electrónica y tu sistema no se conecta con el proveedor.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"sec dark why\" data-section=\"manifiesto\">\n    <div class=\"wrap why-grid\">\n      <div class=\"why-txt\">\n        <h2 class=\"why-h rv\">¿Por qué <b>Log N Labs<\u002Fb>?<\u002Fh2>\n        <div class=\"div3\" aria-hidden=\"true\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fdiv>\n        <div class=\"why-body rv\"><p class=\"why-p1\">En ingeniería de software, la complejidad logarítmica describe los sistemas que <b>se mantienen eficientes a medida que crecen<\u002Fb>.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"why-col rv d1\"><div class=\"why-panel\" role=\"img\" aria-label=\"Gráfico sin números: la curva lineal O(n) sube sin freno; la curva logarítmica O(log n) se aplana a medida que el sistema crece.\">\n        <svg class=\"gr\" sc-camel-view-box=\"0 0 400 340\" sc-camel-preserve-aspect-ratio=\"xMidYMid meet\" aria-hidden=\"true\">\n          <defs><linearGradient id=\"ar-g\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" style=\"stop-color:var(- \"s2\">250.000 pasos<\u002Fspan><span class=\"s3\">500.000 pasos<\u002Fspan><span class=\"s4\">750.000 pasos<\u002Fspan><span class=\"s5\">1.000.000 pasos<\u002Fspan><\u002Fspan><\u002Fdiv><div class=\"rc\"><span class=\"rl\">O(log n):<\u002Fspan><span class=\"rv2\"><span class=\"s1\">10 pasos<\u002Fspan><span class=\"s2\">18 pasos<\u002Fspan><span class=\"s3\">19 pasos<\u002Fspan><span class=\"s4\">20 pasos<\u002Fspan><span class=\"s5\">20 pasos<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div class=\"seam\" aria-hidden=\"true\"><div class=\"wrap\"><i class=\"sm-l\"><\u002Fi><i class=\"sm-n\"><\u002Fi><\u002Fdiv><\u002Fdiv>\n\n  <section class=\"sec dark svc-sec ph ph-dash\" id=\"servicios\" data-section=\"servicios\">\n    <div class=\"wrap split\">\n      <div class=\"sp-l\">\n        <h2 class=\"rv\">Servicios y <b>capacidades<\u002Fb><\u002Fh2>\n        <svg class=\"sv-art\" sc-camel-view-box=\"0 0 400 300\" aria-hidden=\"true\">\n          <path class=\"sv-ax\" d=\"M40 40V260H380\"><\u002Fpath>\n          <path class=\"sv-cv\" d=\"M40 260C70 120 170 90 380 70\"><\u002Fpath>\n          <g class=\"sv-mk\" style=\"transform: translate({{mkX}}px, {{mkY}}px)\"><rect x=\"-6\" y=\"-6\" width=\"12\" height=\"12\"><\u002Frect><\u002Fg>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"sp-r\">\n        <ul class=\"acc\">\n          <sc-for list=\"{{svcRows}}\" as=\"r\" hint-placeholder-count=\"6\">\n            <li class=\"acc-r\">\n              <button type=\"button\" class=\"acc-b\" aria-expanded=\"{{r.on}}\" aria-controls=\"{{r.id}}\" sc-camel-on-click=\"{{r.pick}}\">\n                <span>{{r.a}}<b>{{r.b}}<\u002Fb>{{r.c}}<\u002Fspan>\n                <svg class=\"acc-ic\" sc-camel-view-box=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M12 5v14M6 13l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n              <\u002Fbutton>\n              <div class=\"acc-p {{r.cls}}\" id=\"{{r.id}}\" role=\"regi  <div class=\"chips\" style=\"margin-top: 6px\">\n              <sc-for list=\"{{areas}}\" as=\"a\" hint-placeholder-count=\"5\">\n                <button type=\"button\" class=\"chip {{a.cls}}\" aria-pressed=\"{{a.on}}\" sc-camel-on-click=\"{{a.toggle}}\">{{a.label}}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Ffieldset>\n          <div class=\"fld\"><label for=\"f-detalle\">Detalle del proyecto (opcional)<\u002Flabel><input id=\"f-detalle\" type=\"text\" autocomplete=\"off\" value=\"{{detail}}\" sc-camel-on-change=\"{{setDetail}}\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"gen-col\">\n          <div class=\"fld\"><label for=\"f-msg\">Mensaje<\u002Flabel><textarea id=\"f-msg\" value=\"{{msg}}\" sc-camel-on-change=\"{{setMsg}}\"><\u002Ftextarea><\u002Fdiv>\n          <div class=\"gen-btns\">\n            <button class=\"btn\" type=\"button\" sc-camel-on-click=\"{{sendForm}}\">Enviar consulta<\u002Fbutton>\n<div class=\"gen-links\">\n            <button class=\"tl\" type=\"button\" sc-camel-on-click=\"{{sendWa}}\">Enviar por WhatsApp →<\u002Fbutton>\n            <button class=\"tl\" type=\"button\" sc-camel-on-click=\"{{sendMail}}\">Enviar por correo →<\u002Fbutton>\n            <button class=\"tl\" type=\"button\" sc-camel-on-click=\"{{copyMsg}}\">Copiar mensaje →<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p class=\"notice\" role=\"status\" aria-live=\"polite\">{{notice}}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fform>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <\u002Fmain>\n\n  <footer class=\"ftr {{ftrCls}} ph ph-hw\" data-section=\"footer\">\n    <div class=\"wrap ftr-grid\">\n      <div>\n        <a class=\"logo\" href=\"#inicio\" aria-label=\"Log N Labs, inicio\">\n          <span class=\"wm\">L<span class=\"sl\">og<\u002Fspan> <span class=\"nn\">N<\u002Fspan> <b>Labs<\u002Fb><\u002Fspan>\n        <\u002Fa>\n        <sc-if value=\"{{logoG}}\" hint-placeholder-val=\"{{false}}\">\n          <div class=\"reg rg\" aria-label=\"Registro\">\n            <p class=\"l\"><span class=\"ok\">[ ok ]<\u002Fspan> desarrollo<\u002Fp>\n            <p class=\"l\"><span class=\"ok\">[ ok ]<\u002Fspan> calidad<\u002Fp>\n            <p class=\"l\"><span class=\"ok\">[ ok ]<\u002Fspan> acompañamiento<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <p class=\"soft\" style=\"margin-top: 16px; max-width: 34ch; font-size: 16px\">Software para que ningún pedido se quede en un papel.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <h3>Servicios<\u002Fh3>\n        <ul>\n          <li><a href=\"Servicios.dc.html\">Desarrollo Web y Apps<\u002Fa><\u002Fli>\n          <li><a href=\"Servicios.dc.html\">Testing y QA Automatizado<\u002Fa><\u002Fli>\n          <li><a href=\"Servicios.dc.html\">Automatización de Procesos<\u002Fa><\u002Fli>\n          <li><a href=\"Servicios.dc.html\">Análisis y Diseño de Producto<\u002Fa><\u002Fli>\n          <li><a href=\"Servicios.dc.html\">Revisión de Calidad (Auditoría)<\u002Fa><\u002Fli>\n          <li><a href=\"Servicios.dc.html\">Identidad y Marketing Digital<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div>\n        <h3>Contacto<\u002Fh3>\n        <ul>\n          <li><a href=\"https://wa.me/%%WHATSAPP_NUMBER%%\">%%WHATSAPP_DISPLAY%%<\u002Fa><\u002Fli>\n          <li><a href=\"mailto:%%CONTACT_EMAIL%%\">%%CONTACT_EMAIL_LABEL%%<\u002Fa><\u002Fli>\n          <li>Asunción, Paraguay<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div>\n        <h3>Navegación<\u002Fh3>\n        <ul>\n          <li><a href=\"Servicios.dc.html\">Servicios<\u002Fa><\u002Fli>\n          <li><a href=\"Proceso.dc.html\">Proceso<\u002Fa><\u002Fli>\n          <li><a href=\"Identidad.dc.html\">Identidad y marketing<\u002Fa><\u002Fli>\n          <li><a href=\"Equipo.dc.html\">Equipo y preguntas<\u002Fa><\u002Fli>\n          <li><a href=\"tecnologia.html#contacto\">Contacto<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n  <div class=\"status\" data-section=\"barra-estado\">\n    <div class=\"wrap status-in\">\n      <span><span class=\"dot\" aria-hidden=\"true\"><\u002Fspan><span class=\"sb-loc\">Asunción, PY · GMT-3 · <\u002Fspan>Recibimos proyectos nuevos<\u002Fspan>\n      <span aria-label=\"Hora local en Asunción\">{{clock}}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"pal\" data-section=\"opciones\" sc-camel-on-key-down=\"{{palKey}}\">\n    <sc-if value=\"{{palOpen}}\" hint-placeholder-val=\"{{false}}\">\n      <div class=\"pal-list fade\" id=\"pal-list\" role=\"group\" aria-label=\"Opciones de presentación\">\n        <p class=\"pal-h\">Paleta<\u002Fp>\n        <div class=\"pal-g\" role=\"group\" aria-label=\"Paleta\">\n          <sc-for list=\"{{palettes}}\" as=\"p\" hint-placeholder-count=\"3\">\n            <button type=\"button\" class=\"pal-opt\" aria-pressed=\"{{p.on}}\" sc-camel-on-click=\"{{p.pick}}\">\n              <span>{{p.name}}<\u002Fspan>\n              <span class=\"sw\" aria-hidden=\"true\"><i style=\"background: {{p.c1}}\"><\u002Fi><i style=\"background: {{p.c2}}\"><\u002Fi><i style=\"background: {{p.c3}}\"><\u002Fi><i style=\"background: {{p.c4}}\"><\u002Fi><\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p class=\"pal-h\">Logo<\u002Fp>\n        <div class=\"pal-g\" role=\"group\" aria-label=\"Logo\">\n          <sc-for list=\"{{logos}}\" as=\"g\" hint-placeholder-count=\"3\">\n            <button type=\"button\" class=\"pal-opt\" aria-pressed=\"{{g.on}}\" sc-camel-on-click=\"{{g.pick}}\"><span>{{g.name}}<\u002Fspan><\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p class=\"pal-h\">Pie<\u002Fp>\n        <div class=\"pal-g\" role=\"group\" aria-label=\"Pie\">\n          <button type=\"button\" class=\"pal-opt\" aria-pressed=\"{{regOn}}\" sc-camel-on-click=\"{{toggleReg}}\"><span>Registro [ ok ]<\u002Fspan><\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <button class=\"pal-btn\" type=\"button\" aria-expanded=\"{{palOpen}}\" aria-controls=\"pal-list\" sc-camel-on-click=\"{{togglePal}}\">Opciones<\u002Fbutton>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:8000}}\">\nclass Component extends DCLogic {\n  /* ---------- Paletas (solo para presentar opciones; no se guarda nada) ----------\n     bg / ink / acc definen cada paleta; dark = acento sobre la sección oscura (fondo = ink). */\n  themes = [\n    { key: 'rust',       name: 'Rust',        bg: '#F4EFE7', ink: '#17120F', acc: '#B83A0E', dark: '#E2582A', sw: ['#B83A0E', '#E2582A', '#17120F', '#F4EFE7'] },\n    { key: 'rust-paper', name: 'Rust Paper',  bg: '#E9E1D4', ink: '#17120F', acc: '#8C2C0A', dark: '#E2582A', sw: ['#8C2C0A', '#E2582A', '#17120F', '#E9E1D4'] },\n    { key: 'rust-ember', name: 'Rust Ember',  bg: '#F4EFE7', ink: '#4A1906', acc: '#B83A0E', dark: '#F87A4E', sw: ['#B83A0E', '#F87A4E', '#4A1906', '#F4EFE7'] }\n  ];\n  defaultTheme = 'rust'; // POR DEFECTO: 'rust' | 'rust-paper' | 'rust-ember' (cambiá solo esta línea)\n  logoNames = [['ink', 'Sobre Ink'], ['white', 'Sobre White'], ['rust', 'Sobre Rust']];\n\n  /* ---------- Estado del prototipo (todo simulado, nada se envía) ---------- */\n  state = {\n    nav: false, mega: false, palOpen: false, theme: Math.max(0, this.themes.findIndex((t) => t.key === this.defaultTheme)), logo: 'ink', reg: false, svc: 0, acc: 0, role: 0, roleAuto: true,\n    name: '', contact: '', picked: [], detail: '', override: null, notice: '',\n    clock: this.now()\n  };\n\n  now() {\n    try {\n      return new Intl.DateTimeFormat('es-PY', { timeZone: 'America/Asuncion', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date());\n    } catch (e) { return ''; }\n  }\n\n  /* La paleta activa se aplica con data-pal en la raíz (ver bloques .lnl[data-pal] en el CSS) */\n  applyTheme(i) { this.setState({ theme: i }); }\n\n  /* Elegir un servicio (mega menú o carrusel del hero): abre esa fila del acordeón y lleva la página hasta ahí */\n  goSvc(i) {\n    this.setState({ acc: i, svc: i, nav: false, mega: false });\n    setTimeout(() => {\n      const el = document.getElementById('servicios');\n      if (el) el.scrollIntoView({ behavior: this.reduced ? 'auto' : 'smooth', block: 'start' });\n    }, 30);\n  }\n\n  componentDidMount() {\n    this.reduced = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);\n    /* Red neuronal del hero: deriva lenta y parallax con el puntero (se apaga con prefers-reduced-motion) */\n    const heroEl = document.querySelector('.hero'), net = document.querySelector('.hero-ph');\n    if (heroEl && net && !this.reduced) {\n      let tx = 0, ty = 0, cx = 0, cy = 0, vis = true, raf = 0;\n      heroEl.addEventListener('pointermove', (e) => { const r = heroEl.getBoundingClientRect(); tx = ((e.clientX - r.left) / r.width - .5) * -2; ty = ((e.clientY - r.top) / r.height - .5) * -2; });\n      heroEl.addEventListener('pointerleave', () => { tx = 0; ty = 0; });\n      if ('IntersectionObserver' in window) new IntersectionObserver((es) => { vis = es[0].isIntersecting; if (vis && !raf) raf = requestAnimationFrame(tick); }).observe(heroEl);\n      const tick = (t) => {\n        raf = 0; if (!vis) return;\n        cx += (tx - cx) * .06; cy += (ty - cy) * .06;\n        const dx = Math.sin(t / 4200) * 10, dy = Math.cos(t / 5300) * 8;\n        net.style.setProperty('--px', (cx * 26 + dx).toFixed(2) + 'px'); net.style.setProperty('--py', (cy * 18 + dy).toFixed(2) + 'px');\n        raf = requestAnimationFrame(tick);\n      };\n      raf = requestAnimationFrame(tick);\n    }\n    /* Marca de agua de la banda de frase: máquina de escribir O(n²) → O(n) → O(n log n) → O(log n); arranca al entrar en pantalla */\n    const wm = document.querySelector('.phrase .wm');\n    if (wm && !this.reduced && 'IntersectionObserver' in window) {\n      const seq = ['O(n²)', 'O(n)', 'O(n log n)', 'O(log n)'];\n      const html = (t, last) => { const e = t.replace(/&/g,'&amp;').replace(/<\u002Fg,'&lt;'); return (last ? e.replace(/n\\)$/, '<i>n<\u002Fi>)') : e) ; };\n      let run = false, timers = [];\n      const at = (ms, fn) => timers.push(setTimeout(fn, ms));\n      const paint = (t, last, cur) => { wm.innerHTML = html(t, last) + (cur ? '<span class=\"cu\"><\u002Fspan>' : ''); };\n      const play = () => {\n        timers.forEach(clearTimeout); timers = []; let t0 = 0; let cur = '';\n        wm.classList.remove('off');\n        seq.forEach((w, k) => {\n          const last = k === seq.length - 1;\n          /* como en el video: borra todo y reescribe */\n          for (let c = cur.length; c > 0; c--) { const txt = cur.slice(0, c - 1); t0 += 45; at(t0, () => paint(txt, false, true)); }\n          for (let c = 1; c <= w.length; c++) { const txt = w.slice(0, c); t0 += 95; at(t0, () => paint(txt, last && c === w.length, true)); }\n          cur = w; t0 += last ? 2600 : 900;\n        });\n        at(t0, () => wm.classList.add('off')); at(t0 + 600, () => { if (run) play(); });\n      };\n      new IntersectionObserver((es) => { es.forEach((e) => { if (e.isIntersecting && !run) { run = true; play(); } else if (!e.isIntersecting && run) { run = false; timers.forEach(clearTimeout); wm.classList.remove('off'); paint('O(log n)', true, false); } }); }, { threshold: .4 }).observe(wm);\n    }\n    this.root = document.querySelector('.lnl');\n    this.steps = document.getElementById('pasos');\n\n    /* Reloj en vivo (America/Asuncion) */\n    this.tick = setInterval(() => { const c = this.now(); if (c !== this.state.clock) this.setState({ clock: c }); }, 1000);\n\n    /* Progreso de scroll: barra del header (--scroll) y línea del proceso (--proc) */\n    this.onScroll = () => {\n      const r = this.root; if (!r) return;\n      const vh = window.innerHeight, b = r.getBoundingClientRect(), max = b.height - vh;\n      const p = max > 0 ? Math.min(1, Math.max(0, -b.top / max)) : 0;\n      r.style.setProperty('--scroll', p.toFixed(4));\n      r.style.setProperty('--hs', -b.top > 24 ? '1' : '0');\n      if (!this.reduced) {\n        document.querySelectorAll('.seam').forEach((sm) => { const y = sm.getBoundingClientRect().top; sm.style.setProperty('--pr', Math.max(0, 1 - Math.abs(y - vh * 0.5) / (vh * 0.45)).toFixed(3)); });\n        const w = document.querySelector('[data-section=\"manifiesto\"]');\n        if (w) { const q = w.getBoundingClientRect(); w.style.setProperty('--wp', Math.min(1, Math.max(0, (vh - q.top) / (vh * 0.85))).toFixed(3)); }\n      }\n      if (this.steps) {\n        const q = this.steps.getBoundingClientRect();\n        const k = Math.min(1, Math.max(0, (vh * 0.62 - q.top) / q.height));\n        r.style.setProperty('--proc', k.toFixed(4));\n      }\n    };\n    document.addEventListener('scroll', this.onScroll, true);\n    window.addEventListener('resize', this.onScroll);\n    this.onScroll();\n\n    /* Carrusel de servicios del hero: rota cada 4s, se pausa con mouse/foco y no rota solo con prefers-reduced-motion */\n    this.svcPause = false;\n    this.svcBox = document.querySelector('.m-serv');\n    this.pauseOn = () => { this.svcPause = true; };\n    this.pauseOff = () => { this.svcPause = false; };\n    if (this.svcBox) {\n      ['mouseenter', 'focusin'].forEach((ev) => this.svcBox.addEventListener(ev, this.pauseOn));\n      ['mouseleave', 'focusout'].forEach((ev) => this.svcBox.addEventListener(ev, this.pauseOff));\n    }\n\n    if (!this.reduced) {\n      this.svcTimer = setInterval(() => { if (!this.svcPause) this.setState({ svc: (this.state.svc + 1) % 6 }); }, 4000);\n    }\n\n    /* Roles (Equipo): rotación cada 5s hasta que la persona interactúa; hover/foco activan el panel en horizontal, el clic en todos los anchos */\n    this.rolesBox = document.querySelector('.roles');\n    this.wide = () => !!(window.matchMedia && window.matchMedia('(min-width:1024px)').matches);\n    this.activate = (e) => {\n      const b = e.target && e.target.closest ? e.target.closest('.role-p') : null;\n      if (!b || !this.wide()) return;\n      const i = Array.prototype.indexOf.call(this.rolesBox.querySelectorAll('.role-p'), b);\n      if (i >= 0 && (this.state.role !== i || this.state.roleAuto)) this.setState({ role: i, roleAuto: false });\n    };\n    if (this.rolesBox) ['mouseover', 'focusin'].forEach((ev) => this.rolesBox.addEventListener(ev, this.activate));\n    if (!this.reduced) this.roleTimer = setInterval(() => { if (this.state.roleAuto && this.wide()) this.setState({ role: (this.state.role + 1) % 4 }); }, 5000);\n\n    if (this.reduced || !this.root) return;\n\n    /* Reveal al entrar en vista (con red de seguridad: si no hay scroll, a los 3s se muestra todo) */\n    this.root.classList.add('anim');\n    /* Se vuelve a buscar en cada pasada: el registro [ ok ] del footer (logo G) aparece recién al elegir esa opción */\n    const list = () => Array.prototype.slice.call(this.root.querySelectorAll('.rv, .rg'));\n    this.reveal = () => {\n      const vh = window.innerHeight;\n      list().forEach((el) => { if (!el.classList.contains('in') && el.getBoundingClientRect().top < vh * 0.88) el.classList.add('in'); });\n    };\n    this.onRevealScroll = () => { this.scrolled = true; this.reveal(); };\n    document.addEventListener('scroll', this.onRevealScroll, true);\n    window.addEventListener('resize', this.reveal);\n    this.reveal();\n    this.mo = new MutationObserver(() => this.reveal());\n    this.mo.observe(this.root, { childList: true, subtree: true });\n    this.failsafe = setTimeout(() => { if (!this.scrolled) list().forEach((el) => el.classList.add('in')); }, 3000);\n  }\n\n  componentWillUnmount() {\n    clearInterval(this.tick);\n    clearInterval(this.svcTimer);\n    clearInterval(this.roleTimer);\n    if (this.rolesBox) ['mouseover', 'focusin'].forEach((ev) => this.rolesBox.removeEventListener(ev, this.activate));\n    if (this.svcBox) {\n      ['mouseenter', 'focusin'].forEach((ev) => this.svcBox.removeEventListener(ev, this.pauseOn));\n      ['mouseleave', 'focusout'].forEach((ev) => this.svcBox.removeEventListener(ev, this.pauseOff));\n    }\n    document.removeEventListener('scroll', this.onScroll, true);\n    window.removeEventListener('resize', this.onScroll);\n    document.removeEventListener('scroll', this.onRevealScroll, true);\n    window.removeEventListener('resize', this.reveal);\n    clearTimeout(this.failsafe);\n    if (this.mo) this.mo.disconnect();\n  }\n\n  /* ---------- Generador de mensaje ---------- */\n  buildMsg() {\n    const names = { dev: 'desarrollo web/app', qa: 'testing y QA', auto: 'automatización (n8n)', aud: 'auditoría', idm: 'identidad y marketing' };\n    const s = this.state;\n    const list = ['dev', 'qa', 'auto', 'aud', 'idm'].filter((k) => s.picked.indexOf(k) >= 0).map((k) => names[k]);\n    let areas = '[área de interés]';\n    if (list.length === 1) areas = list[0];\n    else if (list.length > 1) {\n      const last = list[list.length - 1];\n      areas = list.slice(0, -1).join(', ') + (last.charAt(0) === 'i' ? ' e ' : ' y ') + last;\n    }\n    let m = 'Hola, soy ' + (s.name.trim() || '[Nombre]') + '. Quisiera consultar sobre ' + areas + '.';\n    if (s.detail.trim()) m += ' ' + s.detail.trim();\n    if (s.contact.trim()) m += ' Contacto: ' + s.contact.trim() + '.';\n    return m;\n  }\n  say(text) { this.setState({ notice: text }); }\n\n  renderVals() {\n    const s = this.state;\n    const field = (key) => (e) => this.setState({ [key]: e.target.value, override: null, notice: '' });\n\n    /* Mega menú de Servicios */\n    const megaItems = [\n      { n: '01', t: 'Desarrollo Web y Apps', s: 'Sitio, catálogo y formularios que llegan a WhatsApp.' },\n      { n: '02', t: 'Testing y QA Automatizado', s: 'Cada entrega se prueba antes de publicarse.' },\n      { n: '03 aletas */\n    const palettes = this.themes.map((t, i) => ({\n      name: t.name, c1: (t.sw || [t.bg, t.ink, t.acc, t.dark])[0], c2: (t.sw || [t.bg, t.ink, t.acc, t.dark])[1], c3: (t.sw || [t.bg, t.ink, t.acc, t.dark])[2], c4: (t.sw || [t.bg, t.ink, t.acc, t.dark])[3], on: s.theme === i,\n      pick: () => this.applyTheme(i)\n    }));\n\n    return {\n      /* header */\n      navOpen: s.nav, megaOpen: s.mega, navCls: s.nav ? 'open' : '', megaItems: megaItems,\n      toggleNav: () => this.setState({ nav: !s.nav, mega: false }),\n      toggleMega: () => this.setState({ mega: !s.mega }),\n      closeAll: () => this.setState({ nav: false, mega: false }),\n      hdrKey: (e) => { if (e.key === 'Escape') this.setState({ nav: false, mega: false }); },\n      pal: this.themes[s.theme].key,\n      /* equipo */\n      roles: roles, rolesCls: s.roleAuto ? '' : 'manual',\n      /* servicios */\n      svcRows: svcRows, mkX: mk[0].toFixed(1), mkY: mk[1].toFixed(1),\n      /* hero */\n      svcSlides: svcSlides, svcSegs: svcSegs, svcCount: (s.svc + 1) + '/6',\n      /* paletas */\n      palOpen: s.palOpen, palettes: palettes,\n      logos: this.logoNames.map((g) => ({ name: g[1], on: s.logo === g[0], pick: () => this.setState({ logo: g[0] }) })),\n      logoG: s.logo ? s.reg : false, regOn: s.reg, toggleReg: () => this.setState({ reg: !s.reg }),\n      ftrCls: s.logo === 'white' ? 'light' : (s.logo === 'rust' ? 'dark v-rust' : 'dark'),\n      togglePal: () => this.setState({ palOpen: !s.palOpen }),\n      palKey: (e) => { if (e.key === 'Escape') this.setState({ palOpen: false }); },\n      /* generador */\n      name: s.name, contact: s.contact, detail: s.detail, areas: areas,\n      setName: field('name'), setContact: field('contact'), setDetail: field('detail'),\n      msg: s.override !== null ? s.override : this.buildMsg(),\n      setMsg: (e) => this.setState({ override: e.target.value, notice: '' }),\n      noSubmit: (e) => e.preventDefault(),\n      sendForm: () => this.say('
