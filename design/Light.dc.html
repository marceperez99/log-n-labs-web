<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Hero escritorio claro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&amp;family=Space+Grotesk:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; overflow: hidden; background: {{bg}}">
<dc-import name="Main" bg="{{bg}}" fg="{{fg}}" muted="{{muted}}" surface="{{surface}}" line="{{line}}" accent="{{accent}}" on-accent="{{onAccent}}" accent-soft="{{accent}}" logo="{{logo}}" speed="{{speed}}" rotacion="{{rotacion}}" loop="{{loop}}" hint-size="1440px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B83A0E","options":["#B83A0E","#E2582A","#17120F"],"section":"Colores"},"onAccent":{"editor":"color","default":"#F4EFE7","options":["#F4EFE7","#E9E1D4","#17120F"],"section":"Colores"},"bg":{"editor":"color","default":"#F4EFE7","options":["#F4EFE7","#E9E1D4","#FFFFFF"],"section":"Colores"},"surface":{"editor":"color","default":"#E9E1D4","options":["#E9E1D4","#F4EFE7","#FFFFFF"],"section":"Colores"},"line":{"editor":"color","default":"#D6CBBB","options":["#D6CBBB","#C4B8A8","#9A8F85"],"section":"Colores"},"fg":{"editor":"color","default":"#17120F","options":["#17120F","#241C17","#3A2F28"],"section":"Colores"},"muted":{"editor":"color","default":"#6B625A","options":["#6B625A","#3A2F28","#9A8F85"],"section":"Colores"},"logo":{"editor":"enum","default":"on-white","options":["on-white","mono-ink","auto"],"section":"Colores"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    return {
      accent: p.accent ?? '#B83A0E',
      onAccent: p.onAccent ?? '#F4EFE7',
      bg: p.bg ?? '#F4EFE7',
      surface: p.surface ?? '#E9E1D4',
      line: p.line ?? '#D6CBBB',
      fg: p.fg ?? '#17120F',
      muted: p.muted ?? '#6B625A',
      logo: p.logo ?? 'on-white',
      speed: 700,
      rotacion: 4500,
      loop: true
    };
  }
}
</script>
</body>
</html>
