# Publishes the design variations to GitHub Pages.
# Site layout: /            -> redirects to /variations/
#              /variations/ -> index of all variations
#              /logos/      -> shared logo SVGs (variations reference ../../logos/)
# Contact values come from repository variables; see config/.env.example.
name: Deploy variations to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        env:
          WHATSAPP_NUMBER: ${{ vars.WHATSAPP_NUMBER }}
          WHATSAPP_DISPLAY: ${{ vars.WHATSAPP_DISPLAY }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: bash scripts/build-site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
